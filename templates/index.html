<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        歌唱データ・印象評価アップロード
    </title>

</head>


<body>

    <h1>
        歌唱データ・印象評価 一括解析システム
    </h1>

    <p>
        AI採点の納得感向上モデル構築のための
        音響特徴量抽出・データ送信システムです。
    </p>


    <form
        action="/submit"
        method="POST"
        enctype="multipart/form-data"
    >


        <h3>
            1. 歌唱データ（WAV）
        </h3>


        <p>
            複数のWAVファイルを
            一括選択できます。
        </p>


        <input
            type="file"
            name="audio_files"
            accept=".wav,audio/wav"
            multiple
            required
        >



        <h3>
            2. 印象評価データ（CSV）
        </h3>


        <input
            type="file"
            name="eval_csv"
            accept=".csv,text/csv"
            required
        >



        <h3>
            3. 研究利用への確認
        </h3>


        <label>

            <input
                type="checkbox"
                name="allow_feature_use"
                value="yes"
                required
            >

            <strong>
                音声から抽出された音響特徴量と、
                印象評価データを研究分析に利用することに
                同意します。
            </strong>

        </label>



        <br><br>



        <h3>
            4. 元音声の保存について
        </h3>


        <p>
            音響特徴量の抽出には、
            選択されたWAVファイルを一時的に使用します。
        </p>


        <label>

            <input
                type="checkbox"
                name="allow_save"
                value="yes"
            >

            <strong>
                元の歌唱音声（WAVファイル）についても、
                研究用データとして保存することを許可します。
            </strong>

        </label>


        <p>

            <small>

                チェックしない場合、
                元音声は特徴量抽出処理にのみ一時的に使用し、
                研究用データとして保存しません。

                処理終了後、
                Render上の一時ファイルを削除します。

            </small>

        </p>



        <br>


        <button type="submit">

            音響特徴量を抽出して送信

        </button>


    </form>


</body>

</html>
