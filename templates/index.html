<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歌唱データ＆印象評価入力システム</title>
</head>
<body>
    <h1>歌唱データと印象評価の入力</h1>

    <!-- 音声ファイルと評価を一緒に送信するフォーム -->
    <form action="/submit" method="POST" enctype="multipart/form-data">
        
        <h3>1. 歌唱データ (WAVファイル) のアップロード</h3>
        <input type="file" name="audio_file" accept=".wav" required>
        
        <h3>2. 印象評価</h3>
        <p>このAI採点の評価結果に対する納得感を教えてください（1:全く納得できない 〜 5:非常に納得できる）</p>
        <input type="radio" name="satisfaction" value="1"> 1
        <input type="radio" name="satisfaction" value="2"> 2
        <input type="radio" name="satisfaction" value="3"> 3
        <input type="radio" name="satisfaction" value="4"> 4
        <input type="radio" name="satisfaction" value="5"> 5
        
        <br><br>
        <button type="submit">送信して特徴量と評価を保存</button>
    </form>
</body>
</html>
